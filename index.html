<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-btn" type="button">☀️ Modo claro</button>

  <div class="wrapper">
    <h1 class="game-title" aria-label="Tetris">
      <span style="--c:#e57373">T</span><span style="--c:#f2a65a">E</span><span style="--c:#f7d774">T</span><span style="--c:#7ed97e">R</span><span style="--c:#7aa2f7">I</span><span style="--c:#b48ef7">S</span>
    </h1>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <p id="record-badge" class="record-badge hidden">¡Nuevo récord!</p>

        <form id="name-form" class="name-form hidden" autocomplete="off">
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
          <button id="save-btn" type="submit">Guardar</button>
        </form>

        <section id="records" class="records">
          <span class="label">RECORDS</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="records-empty" class="records-empty">Todavía no hay records</p>
          <p class="records-stats">
            Mejor combo: <span id="best-combo">0</span>
            · Líneas máx.: <span id="max-lines">0</span>
          </p>
          <button id="reset-records-btn" class="btn-secondary" type="button">Borrar records</button>
        </section>

        <button id="play-btn" class="btn-primary" type="button">Jugar</button>
        <button id="restart-btn" class="btn-primary hidden" type="button">Reiniciar</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
